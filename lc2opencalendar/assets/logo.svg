<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">lc2opencalendar logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <clipPath id="page">
      <rect x="20" y="30" width="88" height="80" rx="12"/>
    </clipPath>
  </defs>
  <!-- background tile -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- calendar page -->
  <rect x="20" y="30" width="88" height="80" rx="12" fill="#FFFFFF"/>
  <!-- header band -->
  <path d="M20 42a12 12 0 0 1 12-12h64a12 12 0 0 1 12 12v8H20z" fill="#DBEAFE"/>
  <!-- binder rings -->
  <rect x="40" y="20" width="8" height="20" rx="4" fill="#FFFFFF"/>
  <rect x="80" y="20" width="8" height="20" rx="4" fill="#FFFFFF"/>
  <!-- rising sun: an "open day" -->
  <g clip-path="url(#page)">
    <circle cx="64" cy="98" r="24" fill="url(#sun)"/>
    <g stroke="#F97316" stroke-width="5" stroke-linecap="round">
      <line x1="64" y1="62" x2="64" y2="68"/>
      <line x1="38" y1="72" x2="42.5" y2="76.5"/>
      <line x1="90" y1="72" x2="85.5" y2="76.5"/>
    </g>
    <!-- horizon -->
    <rect x="20" y="96" width="88" height="14" fill="#1D4ED8"/>
  </g>
</svg>
