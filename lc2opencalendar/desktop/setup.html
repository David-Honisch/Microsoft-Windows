<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect to lc2opencalendar</title>
    <style>
      :root {
        --bg: #fff;
        --fg: #1f1f1f;
        --muted: #5f6368;
        --line: #dadce0;
        --accent: #0b57d0;
        --accent-fg: #fff;
        --error: #b3261e;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131314;
          --fg: #e3e3e3;
          --muted: #9aa0a6;
          --line: #444746;
          --accent: #a8c7fa;
          --accent-fg: #062e6f;
          --error: #f2b8b5;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: min(440px, 100% - 32px);
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        font-size: 22px;
        font-weight: 500;
        margin: 16px 0 4px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 4px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .error {
        color: var(--error);
        margin: 8px 0 0;
        min-height: 1.5em;
      }
      button {
        margin-top: 12px;
        padding: 10px 24px;
        font: inherit;
        font-weight: 500;
        border: 0;
        border-radius: 20px;
        background: var(--accent);
        color: var(--accent-fg);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon.png" alt="" />
      <h1>Connect to your lc2opencalendar server</h1>
      <p>Your calendar lives on your server. Enter the address you open in the browser. The server must include the built frontend.</p>
      <form id="form">
        <label for="url">Server address</label>
        <input id="url" type="text" placeholder="http://localhost:10085" autocomplete="url" spellcheck="false" autofocus />
        <div class="error" id="error" role="alert"></div>
        <button id="go" type="submit">Connect</button>
      </form>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const input = document.getElementById('url');
      const error = document.getElementById('error');
      const button = document.getElementById('go');
      input.value = params.get('server') || '';
      error.textContent = params.get('error') || '';
      input.select();
      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        button.disabled = true;
        button.textContent = 'Connecting…';
        error.textContent = '';
        const res = await window.lc2opencalendarSetup.connect(input.value);
        if (res && res.error) {
          error.textContent = res.error;
          button.disabled = false;
          button.textContent = 'Connect';
          input.focus();
        }
      });
    </script>
  </body>
</html>
